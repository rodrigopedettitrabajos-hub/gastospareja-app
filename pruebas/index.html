<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gastos Pareja (PRUEBAS)</title>
<meta name="theme-color" content="#1f2a30">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #1f2a30; color: #e8eaed; font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #f3f4f0; }
  #aviso { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; background: #1f2a30; text-align: center; }
  #aviso.ver { display: flex; }
  #aviso .caja { max-width: 340px; }
  #aviso .ico { font-size: 56px; }
  #aviso a { display: inline-block; margin-top: 14px; padding: 12px 20px; border-radius: 12px; background: #fff; color: #1f2a30; font-weight: 700; text-decoration: none; }
  #aviso .chico { margin-top: 12px; font-size: 13px; color: #9aa4ac; }
</style>
</head>
<body>
<iframe id="web" title="Gastos Pareja" allow="microphone; camera; clipboard-read; clipboard-write; fullscreen"></iframe>
<div id="aviso"><div class="caja">
  <div class="ico">💰</div>
  <div id="avisoTxt">Está tardando en abrir.</div>
  <a id="abrir" href="#">Abrir la web</a>
  <div class="chico">Si Google te pide entrar con tu cuenta, entrá y después abrí la app de nuevo.</div>
</div></div>
<script>
  // Web de Apps Script de este ambiente.
  var WEB = 'https://script.google.com/macros/s/AKfycbz02ttdCiUoYMmGERl5ivVXAGExnNfNnWpaMzyUcEykySKzkfMUhQ48Sg3oNSi6teOP/exec';
  var ESPERA_MS = 15000;

  // La web se muestra adentro (pantalla completa, sin barra). Cuando termina de cargar avisa con un mensaje.
  // Si no avisa a tiempo (por ejemplo, Google pide iniciar sesión, que no se puede hacer adentro),
  // se ofrece abrirla directo: ahí puede aparecer una barrita arriba, pero anda todo igual.
  var lista = false;
  // Accesos directos del ícono (mantener apretado): abren la web en esa sección.
  var vista = (/[?&]vista=([a-z]+)/.exec(location.search) || [])[1];
  if (vista === 'surtidos' || vista === 'nuevo') WEB += '?vista=' + vista;
  document.getElementById('abrir').href = WEB;
  document.getElementById('web').src = WEB;
  window.addEventListener('message', function (e) {
    if (!/^https:\/\/[a-z0-9-]*script\.googleusercontent\.com$/.test(e.origin)) return;
    if (e.data && e.data.gastosPareja === 'lista') {
      lista = true;
      document.getElementById('aviso').classList.remove('ver');
    }
  });
  setTimeout(function () { if (!lista) document.getElementById('aviso').classList.add('ver'); }, ESPERA_MS);

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
